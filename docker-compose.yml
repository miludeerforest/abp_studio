services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:33013:8000"
    restart: always
    networks:
      - default
      - 1panel-network
    env_file:
      - .env
    environment:
      # Redis 配置 - 从 .env 读取
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:33012:80"
    depends_on:
      - backend
    restart: always
    networks:
      - default
      - 1panel-network

networks:
  1panel-network:
    external: true
